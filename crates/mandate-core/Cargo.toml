[package]
name = "mandate-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Human-signed, cart-bound spend mandates for AI agents. The agent carries a mandate; it can never forge one."

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
p256 = { version = "0.14", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
serde_jcs = "0.2.0"
