[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
# vulnerability/notice are now deny by default (see cargo-deny 0.20 migration)
yanked = "warn"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
]

[[bans.skip]]
name = "h2"
version = "0.4.12"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
