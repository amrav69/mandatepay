# cargo-deny 0.20 configuration. The pre-0.18 keys
# (advisories.vulnerability/unmaintained/yanked/notice, graph table-form
# targets) no longer parse; this file tracks the current schema.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

# Allowlist is intentionally minimal: an unlisted license fails the check
# (fail-closed) so new dependencies get explicit review.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
