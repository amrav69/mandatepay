name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Coverage
        run: |
          cargo install cargo-tarpaulin --locked
          cargo tarpaulin --out Xml --fail-under 60

      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories || true

      - name: Attack suite against live server
        run: |
          export CI_SEED=$(openssl rand -base64 32)
          export CI_API_KEY=$(openssl rand -base64 32)
          MANDATEPAY_API_KEY=$CI_API_KEY MANDATEPAY_MAX_CAP=100000 MANDATEPAY_SEED=$CI_SEED cargo run --bin mandatepay &
          sleep 5
          MANDATEPAY_API_KEY=$CI_API_KEY MANDATEPAY_SEED=$CI_SEED cargo run --bin eval
          MANDATEPAY_API_KEY=$CI_API_KEY MANDATEPAY_SEED=$CI_SEED cargo run --bin chaos
          curl -s http://127.0.0.1:8080/v1/chain/verify | grep -q '"chain_valid":true'
