name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CI_SEED: bk6N03RyzsSo4jj2Eg/X2yirn/FNbJuc+Q2hW37kdTQ=

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Attack suite against live server
        run: |
          MANDATEPAY_SEED=$CI_SEED cargo run --bin mandatepay &
          sleep 5
          MANDATEPAY_SEED=$CI_SEED cargo run --bin eval
